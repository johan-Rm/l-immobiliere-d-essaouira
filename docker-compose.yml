services:
  backend:
    build:  # 🛠 Configuration de la construction de l’image Docker
      context: ./digital-management-system  # 📁 Dossier source du projet Symfony
      dockerfile: Dockerfile  # 📦 Dockerfile utilisé pour la construction
    container_name: immobiliere_essaouira_backend  # 🐳 Nom explicite du conteneur backend
    restart: unless-stopped  # 🔁 Redémarrage automatique sauf en cas d’arrêt manuel
    working_dir: /var/www/html  # 📌 Dossier de travail par défaut dans le conteneur
    volumes:  # 📦 Déclaration des volumes montés dans le conteneur backend
      - ./digital-management-system:/var/www/html  # 🔄 Bind mount pour développement : code live depuis l'hôte
      - ./nuxt-modern-website:/app  # 🔄 Bind mount du projet frontend (dev uniquement), permet au backend d’écrire dans le frontend
      - ./digital-management-system/public/uploads:/var/www/html/public/uploads  # 📂 Volume persistant pour les fichiers uploadés (images, documents…)
      - ./digital-management-system/public/media:/var/www/html/public/media  # 🖼 Volume persistant pour les médias générés (ex: cache LiipImagine)
      - ./nuxt-modern-website/update:/app/update  # 📁 Volume partagé pour les fichiers dynamiques que Symfony génère pour Nuxt (routes, payloads…)
      - ./nuxt-modern-website/lang:/app/lang  # 🌍 Volume partagé pour les fichiers de traduction `.json`, générés par Symfony, lus par Nuxt
      - ./nuxt-modern-website/lang/translations:/app/lang/translations  # 🌍 Volume partagé pour les fichiers de traduction `.json`, générés par Symfony, lus par Nuxt
    environment:  # 🌡️ Variables d’environnement pour configurer Symfony et ses outils
      - APP_ENV=dev  # ⚙️ Mode de l’application (dev/prod/test)
      - DATABASE_URL=mysql://${MYSQL_USER:?Set MYSQL_USER}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE}  # 🛢 Connexion à la base de données
      - XDEBUG_MODE=debug  # 🐛 Activation du mode debug pour Xdebug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003  # 📡 Configuration du client Xdebug (IDE)
      - COMPOSER_MEMORY_LIMIT=-1  # 🧠 Désactive la limite mémoire pour Composer
    ports:  # 🌍 Ports exposés en local
      - "9003:9003"  # 🔁 Port pour Xdebug (remote debugging PHP)
    depends_on:  # 🧷 Dépendance de service : attend que `db` soit disponible avant de démarrer
      - db
    networks:  # 🌐 Rattachement au réseau Docker partagé
      - immobiliere_essaouira

  frontend:
    build:
      context: ./nuxt-modern-website  # 🛠 Dossier contenant le projet Nuxt
    container_name: immobiliere_essaouira_frontend  # 🐳 Nom explicite du conteneur frontend
    ports:
      - "127.0.0.1:3000:3000"  # 🌐 Exposition du port de développement Nuxt
    working_dir: /app  # 📌 Répertoire de travail dans le conteneur
    volumes:
      - ./nuxt-modern-website:/app  # 🔄 Bind mount pour développement : code live depuis l'hôte
      - ./nuxt-modern-website/update:/app/update  # 📁 Volume partagé avec le backend pour les fichiers dynamiques (ex: routes Nuxt)
      - ./nuxt-modern-website/lang:/app/lang  # 🌍 Volume partagé avec le backend pour les fichiers de traduction `.json`
      - ./digital-management-system/public/media/cache:/app/static/media/cache  # 🖼 Volume partagé : expose les images générées par Symfony dans le dossier statique Nuxt
      - ./digital-management-system/public/uploads:/app/static/uploads  # 🖼 Volume partagé : expose les images générées par Symfony dans le dossier statique Nuxt
      - /app/node_modules  # 🚫 Empêche la surcharge des node_modules de l’hôte      
    environment:
      - HOST=0.0.0.0  # 🌐 Écoute toutes les interfaces (nécessaire dans Docker)
    depends_on:
      - backend  # 🔄 S’assure que le backend est prêt avant lancement
    networks:
      - immobiliere_essaouira  # 🌐 Rattachement au réseau applicatif commun

  db:
    image: mysql:8.0  # 🐬 Image officielle MySQL 8 utilisée comme base de données
    container_name: immobiliere_essaouira_db  # 🐳 Nom explicite du conteneur MySQL
    restart: unless-stopped  # 🔁 Redémarre automatiquement sauf arrêt manuel
    environment:  # ⚙️ Variables d’environnement pour initialiser la base
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}  # 📁 Nom de la base créée au démarrage
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}  # 👤 Utilisateur MySQL standard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}  # 🔐 Mot de passe de l’utilisateur standard
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}  # 🔐 Mot de passe root MySQL
    volumes:
      - db_data:/var/lib/mysql  # 💾 Volume persistant pour stocker les données de la base
    ports:
      - "127.0.0.1:3306:3306"  # 🌐 Port exposé en local pour se connecter à MySQL
    networks:
      - immobiliere_essaouira  # 🌐 Réseau Docker commun à tous les services

  nginx:
    image: nginx:alpine  # 🌐 Serveur HTTP léger basé sur Alpine (très rapide)
    container_name: immobiliere_essaouira_nginx  # 🐳 Nom explicite du conteneur NGINX
    restart: unless-stopped  # 🔁 Redémarre automatiquement sauf arrêt manuel
    ports:
      - "127.0.0.1:8080:80"  # 🌍 Expose le port 80 interne sur le port 8080 local
    volumes:
      - ./digital-management-system:/var/www/html  # 📂 Montre le code Symfony au serveur NGINX
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # ⚙️ Configuration personnalisée de NGINX
    depends_on:
      - backend  # ⏱ S’assure que le backend est démarré avant NGINX
    networks:
      - immobiliere_essaouira  # 🌐 Rattachement au réseau partagé

  mailhog:
    image: mailhog/mailhog  # 📧 Image MailHog pour intercepter les e-mails envoyés en dev
    container_name: immobiliere_essaouira_mailhog  # 🐳 Nom explicite du conteneur MailHog
    restart: unless-stopped  # 🔁 Redémarre automatiquement sauf arrêt manuel
    ports:
      - "127.0.0.1:8025:8025"  # 🌍 Accès à l’interface MailHog via http://localhost:8025
    networks:
      - immobiliere_essaouira  # 🌐 Réseau Docker partagé

volumes:
  db_data:  # 💾 Stockage des données MySQL

networks:
  immobiliere_essaouira:
    driver: bridge  # 🌐 Réseau Docker interne (bridge) commun à tous les services
